  <link id="mjTouchIcon" rel="apple-touch-icon" href="assets/hero-main.jpg" />
  <script>
    (() => {
      const touchIcon = document.getElementById('mjTouchIcon');
      const hero = new Image();
      hero.src = 'assets/hero-main.jpg';
      hero.onload = () => {
        try {
          const side = Math.min(hero.naturalWidth, hero.naturalHeight);
          const sx = Math.max(0, Math.round((hero.naturalWidth - side) / 2));
          const sy = Math.max(0, Math.round((hero.naturalHeight - side) / 2));
          const canvas = document.createElement('canvas');
          canvas.width = 512;
          canvas.height = 512;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(hero, sx, sy, side, side, 0, 0, 512, 512);
          touchIcon.href = canvas.toDataURL('image/png');
        } catch (_) {
          touchIcon.href = 'assets/hero-main.jpg';
        }
      };
    })();
  </script>
