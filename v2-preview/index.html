<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080806" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MJ Hospitality V2 Preview" />
  <meta name="description" content="MJ Hospitality — V2 isolated preview" />
  <title>MJ Hospitality — V2 Preview</title>
  <base href="../" />

  <link rel="stylesheet" href="app.css?v=hero-portrait-2" />
  <link rel="stylesheet" href="v2-preview/v2-final.css?v=d3e2a260" />
  <style>
    /* Critical hero override: prevents any cached/legacy overlay layout on iPhone. */
    .hero{position:relative!important;display:flex!important;flex-direction:column!important;min-height:0!important;height:auto!important;overflow:hidden!important;background:#080806!important}
    .hero>img{position:relative!important;inset:auto!important;order:1!important;width:100%!important;height:58svh!important;min-height:470px!important;max-height:570px!important;object-fit:cover!important;object-position:center center!important;display:block!important;transform:none!important;transition:none!important}
    .hero:hover>img{transform:none!important}.hero .shade{display:none!important}
    .heroCopy{position:relative!important;inset:auto!important;order:2!important;z-index:2!important;min-height:0!important;height:auto!important;display:block!important;padding:24px 18px 10px!important;margin:0!important;background:linear-gradient(180deg,#0a0908,#080806)!important}
    .hero h1{margin:10px 0 0!important;font-size:clamp(39px,10.5vw,68px)!important;line-height:1!important;text-shadow:none!important}.hero .lead{margin:12px 0 0!important}
    .heroExplore{position:relative!important;inset:auto!important;order:3!important;align-self:flex-start!important;margin:0 18px 24px!important;padding:8px 0!important}
    @media(min-width:768px){.hero>img{height:62svh!important;min-height:520px!important;max-height:720px!important}.heroCopy{padding:28px 5vw 12px!important}.heroExplore{margin:0 5vw 28px!important}}
  </style>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button id="backBtn" class="btn iconBtn" type="button" aria-label="Back" hidden>‹</button>
      <button id="brandBtn" class="brand" type="button" aria-label="Home" title="Home">
        <span class="brandMark">MJ</span><span class="brandCopy">PRIVATE<br /><b>HOSPITALITY COLLECTION</b></span>
      </button>
      <div class="actions">
        <button id="searchBtn" class="btn iconBtn" type="button" aria-label="Search">⌕</button>
        <button id="langBtn" class="btn" type="button">عربي</button>
      </div>
    </header>
    <main id="main" aria-live="polite"></main>
    <nav class="bottomNav">
      <button data-go="/" data-active="/"><span>⌂</span><small data-nav-label="home">Home</small></button>
      <button data-go="/collection/arabic" data-active="/collection/arabic"><span>◒</span><small data-nav-label="arabic">Arabic</small></button>
      <button data-go="/collection/specialty" data-active="/collection/specialty"><span>◉</span><small data-nav-label="coffee">Coffee</small></button>
      <button data-go="/collection/tea" data-active="/collection/tea"><span>♨</span><small data-nav-label="tea">Tea</small></button>
      <button data-go="/collection/sparkling" data-active="/collection/sparkling"><span>✦</span><small data-nav-label="spark">Sparkling</small></button>
    </nav>
  </div>
  <script src="menu-data.js?v=hero-portrait-2"></script>
  <script src="menu-extra.js?v=hero-portrait-2"></script>
  <script src="source-data.js?v=hero-portrait-2"></script>
  <script src="https://cdn.jsdelivr.net/gh/Mralnajdi/mj-hospitality@8d487c37733ac76145ac16cb14d549f159abae05/v2-final-data.js"></script>

  <script src="app.js?v=hero-portrait-2"></script>
  <script src="https://cdn.jsdelivr.net/gh/Mralnajdi/mj-hospitality@8d487c37733ac76145ac16cb14d549f159abae05/v2-final-runtime.js"></script>
